name: Tests

# Spec: docs/spec_2026-08-18_downloadable_release.md#r-m3
#
# The value of this workflow is the blank machine: no built venv, no packages
# installed here months ago, no ~/Library state. It catches what "works on my
# Mac" hides — which matters more because this repo is shared between two Macs.
#
# Two rules this file must keep:
#   * Success is decided by pytest's EXIT CODE. Never grep stdout for "passed" —
#     `2 failed, 2181 passed` contains that word and would report green.
#   * No check lives only here. Every assertion belongs in the pytest suite so it
#     can fail before a push; this workflow only invokes that suite.
# Both are enforced by tests/test_ci_contract.py.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # README claims "Python 3.11+", so every one of those is tested.
        # tests/test_ci_contract.py asserts this matrix covers the claim.
        python-version: ['3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system packages for headless Tk and the colour scan
        # python3-tk: CustomTkinter needs real Tk; the setup-python build has it,
        # but xvfb supplies the display the GUI tests would otherwise skip for.
        # ripgrep: tools/color_audit.py shells out to it, and the suite checks
        # the generated inventory is current. Not a Python dependency, so it
        # cannot come from requirements-dev.txt.
        # Retried (BSF-M7, CI-A1): on 2026-11-11 a mirror DNS outage failed all
        # three jobs here before pytest ran, and a re-run four minutes later
        # failed the same way. Acquire::Retries covers a dropped file; the loop
        # covers an outage of a few minutes. The step limit bounds both.
        timeout-minutes: 15
        run: |
          for attempt in 1 2 3; do
            sudo apt-get -o Acquire::Retries=3 update &&
              sudo apt-get -o Acquire::Retries=3 install -y xvfb python3-tk ripgrep &&
              exit 0
            [ "$attempt" = 3 ] && break
            echo "apt attempt $attempt failed; retrying in $((attempt * 60))s"
            sleep $((attempt * 60))
          done
          exit 1

      - name: Install dependencies
        # requirements-dev.txt includes requirements.txt, so this installs the
        # runtime set plus pytest and nothing else — an undeclared dependency
        # must fail here. Installing pytest by name instead would let a missing
        # declaration pass on the blank machine this workflow exists to be.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run test suite
        # xvfb-run provides the display, so the Tk tests execute instead of
        # skipping. The step's success is pytest's exit code, nothing else.
        env:
          CI: 'true'
        run: |
          xvfb-run -a python -m pytest -q
